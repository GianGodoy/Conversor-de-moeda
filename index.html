<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>Conversor de Moeda</title>
</head>

<body>

    <img class="logo" src="./assets/money.jpg" alt="gif-Conversor">

    <main>

        <label> <!--serve para definir um rótulo-->
            Converter <b>de</b>
            <select>
                <option> R$ Real brasileiro </option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="notes-for-conversion">
                <option value="real">Real brasileiro</option>
                <option value="dolar">US$ Dólar americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
                <option value="bitcoin">₿ Bitcoin</option>
            </select>

            <label> Valor </label>
            <input class="input-currency" placeholder=" R$ 10.000,00">
            <!--input e um caixinha e o placeholder e o texto dentro da caixnha-->
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img src="./assets/Real.png" alt="logo-moeda-real">
                <p class="currency">Real</p>
                <p class="currency-value">R$ 0,00</p>
            </div>

            <img class="arrow-img" src="assets/Arrow.png" alt="logo-seta-conversor">

            <div class="currency-box">
                <img class="currency-dolar" src="./assets/Dolar.png" alt="logo-moeda-dolar">
                <p class="currency" id="currency-name">Dólar</p>
                <p class="currency-value-convert">US$ 0,00</p>
            </div>
        </section>
    </main>

</body>
<script src="./script.js"></script>

</html>
